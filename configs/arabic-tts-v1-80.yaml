restore_model: ./pretrained/mixer_lj_80.pth

log_dir: logs/arabic-tts-v1-80
checkpoint_dir: checkpoints/arabic-tts-v1-80

train_audio_dir: ./data/arabic-tts-dataset-v1/wav
train_labels: ./data/arabic-tts-dataset-v1/metadata_train.csv
